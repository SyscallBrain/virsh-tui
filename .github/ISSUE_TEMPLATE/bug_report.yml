name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A few things first:

        - Remove host names, addresses and other private details from what you paste.
        - For a security problem, use a [private advisory](https://github.com/SyscallBrain/virsh-tui/security/advisories/new) instead (see SECURITY.md).
        - Run `virsh-tui --doctor` first (virsh-tui 0.3.0 or later): it checks the connection, permissions,
          tools, config files and terminal, and says what to do about each problem.
        - Most failures come from `virsh` itself: try the same thing with `virsh -c <uri> …` first.
          [Troubleshooting](https://syscallbrain.github.io/virsh-tui/troubleshooting.html) covers connections, colours, fonts and the wizard.
  - type: input
    id: version
    attributes:
      label: virsh-tui version
      description: The output of `virsh-tui -V`.
      placeholder: virsh-tui 0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install virsh-tui?
      options:
        - AUR (virsh-tui or virsh-tui-bin)
        - .deb package
        - .rpm package
        - Arch package from the release page
        - Release tarball
        - cargo install
        - Built from a clone of the repository
        - Other
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of virsh-tui --doctor
      description: |
        virsh-tui 0.3.0 or later. Run `virsh-tui --doctor` (add `-c <uri>` if you use one), or press `Y` in Settings › Doctor to copy it.
        It includes the versions, distribution and connection, so you can skip those fields below.
        Check it for private details first: user names (`sudo usermod … <user>`) and host names in remote URIs.
      render: text
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did (keys pressed, command typed), what you expected, and what happened instead. A screenshot helps with drawing problems.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it also happens in demo mode (`virsh-tui --demo`), say so.
      placeholder: |
        1. Select a running domain
        2. Press …
  - type: input
    id: virsh
    attributes:
      label: libvirt version
      description: The output of `virsh --version`. Not needed if you pasted the doctor report.
      placeholder: "11.9.0"
  - type: dropdown
    id: uri
    attributes:
      label: Connection
      description: Not needed if you pasted the doctor report.
      options:
        - qemu:///system
        - qemu:///session
        - remote (qemu+ssh or other)
        - demo mode
  - type: textarea
    id: log
    attributes:
      label: Last lines of the log
      description: From `~/.local/state/virsh-tui/virsh-tui.log`. If it says too little, run `RUST_LOG=virsh_tui=debug virsh-tui`, repeat what failed and copy the new lines.
      render: text
  - type: input
    id: os
    attributes:
      label: Distribution
      description: Not needed if you pasted the doctor report.
      placeholder: Arch Linux, Debian 13, Fedora 43 …
  - type: input
    id: terminal
    attributes:
      label: Terminal emulator
      description: The doctor reports the size and colours, not the emulator; say if it runs inside tmux or screen.
      placeholder: kitty 0.40, inside tmux 3.5
