name: Feature request
description: Suggest a new feature or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task you are trying to get done, and how you do it today (for example with a virsh command).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How it could work in virsh-tui
      description: Keys, screens or commands you have in mind. Optional.
