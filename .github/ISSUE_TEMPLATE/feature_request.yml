name: Feature request
description: An idea for virsh-tui
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please search the [existing issues](https://github.com/SyscallBrain/virsh-tui/issues?q=is%3Aissue) first; if the idea is
        already there, a 👍 on it tells us more than a new issue. Open-ended ideas can also go to
        [Discussions](https://github.com/SyscallBrain/virsh-tui/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The task you are trying to get done, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could virsh-tui help?
      description: A key, a view, a command, an option … whatever you have in mind.
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
      description: The workaround you use now, if any, for example a `virsh` command.
