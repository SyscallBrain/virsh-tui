[package]
name = "virsh-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Keyboard-driven terminal UI for libvirt/virsh with vim keys and live graphs"
authors = ["SyscallBrain"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/SyscallBrain/virsh-tui"
homepage = "https://syscallbrain.github.io/virsh-tui/"
documentation = "https://syscallbrain.github.io/virsh-tui/"
keywords = ["libvirt", "virsh", "tui", "kvm", "qemu"]
categories = ["command-line-utilities", "virtualization"]
exclude = ["/book", "/docs", "/scripts", "/tests/snapshots", "/.github"]

[dependencies]
arboard = "3.6.1"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
hostname = "0.4.2"
jiff = "0.2.37"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", features = ["crossterm"] }
regex = "1.13.1"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "2.0.1"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "io-util", "fs"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
xmltree = "0.12.0"

[dev-dependencies]
insta = "1.49.0"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[features]
it = []
